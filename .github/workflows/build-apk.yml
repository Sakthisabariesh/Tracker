name: Build Android APK & Direct Download Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Android Debug APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          
          # Prepare named APK for direct download
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/*.apk release-apk/ExpensePulse.apk
          cp app/build/outputs/apk/debug/*.apk release-apk/ExpensePulse-v1.0.${{ github.run_number }}.apk

      - name: Upload Artifact (Actions Tab)
        uses: actions/upload-artifact@v4
        with:
          name: ExpensePulse-Android-APK
          path: release-apk/ExpensePulse.apk
          retention-days: 30

      - name: Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "ExpensePulse v1.0.${{ github.run_number }} (Latest APK)"
          body: |
            ## 📱 ExpensePulse — Production Native Android APK

            Download the ready-to-install Android APK directly to your phone below.

            ### 📥 Direct Download:
            - **[👉 Download ExpensePulse.apk](https://github.com/Sakthisabariesh/Tracker/releases/download/v1.0.${{ github.run_number }}/ExpensePulse.apk)** (Click to start download)

            ---

            ### ✨ Key Features Included in this Build:
            - 💎 **Bespoke Enterprise UI**: Luxury obsidian & titanium aesthetic.
            - ⚡ **Dual Income & Expense Tracking (+ / -)**: Salary, Freelance, Dining, Bills, etc., with real-time Net Savings calculation.
            - 📊 **7-Day Spend Activity Trend**: Interactive Canvas bar chart with category breakdown tooltip.
            - 📅 **Spending Heatmap Calendar**: Tap any date to inspect day activity and itemized transactions.
            - ⚡ **Rapid <3s Quick Log**: Custom touch keypad with instant category and date chips.
            - ⚙️ **Custom Budget Caps**: Live editable monthly budget and daily spending target.
            - 🔒 **100% Offline-First**: Room database persistence with CSV data export.
          files: |
            release-apk/ExpensePulse.apk
            release-apk/ExpensePulse-v1.0.${{ github.run_number }}.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
