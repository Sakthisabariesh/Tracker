name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: |
          chmod +x ./gradlew || true
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Generating Gradle wrapper files..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExpensePulse-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Display Build Summary
        run: |
          echo "### 🎉 Android APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "You can download the APK from the **Artifacts** section at the bottom of this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "- **App Name**: ExpensePulse" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type**: Debug APK" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Architecture**: Universal (OnePlus 13R & Android 15/16 ready)" >> $GITHUB_STEP_SUMMARY
