name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate Wrapper and Build APK
        run: |
          gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExpensePulse-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Display Build Summary
        if: success()
        run: |
          echo "### 🎉 Android APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK directly from the **Artifacts** section below." >> $GITHUB_STEP_SUMMARY
          echo "- **App**: ExpensePulse" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: Debug APK" >> $GITHUB_STEP_SUMMARY
